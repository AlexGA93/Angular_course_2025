<h1 class="text-2xl font-bold">Listado de Productos</h1>
<h3 class="text-lg">Total de Productos: 
    <span class="text-accent">{{ productsResource.value()?.count }}</span>
</h3>

<div class="divider"></div>

<!-- PAGINATION -->
<app-pagination
    [pages]="productsResource.value()?.pages ?? 0"
    [currentPage]="getCurrentPage()"
    (productsPerPageChange)="onProductsPerPageChange($event)"
/>

<button class="m-2 p-2 btn btn-primary" routerLink="/admin/products/new">Nuevo Producto</button>

<!-- Listado de Productos -->
<product-table [products]="getRxResourceProducts()"></product-table>

<!-- PAGINATION -->
<app-pagination
    [pages]="productsResource.value()?.pages ?? 0"
    [currentPage]="getCurrentPage()"
    (productsPerPageChange)="onProductsPerPageChange($event)"
/>
